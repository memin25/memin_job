<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Netlify form tanımı</title>
</head>
<body>
  <!-- Deploy sırasında Netlify Forms alanlarını kaydetmek için; ziyaretçilere gösterilmez -->
  <form name="iletisim" method="POST" data-netlify="true" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="iletisim">
    <p><label>Bot <input name="bot-field"></label></p>
    <input name="name" type="text">
    <input name="email" type="email">
    <input name="subject" type="text">
    <textarea name="message"></textarea>
  </form>
</body>
</html>
